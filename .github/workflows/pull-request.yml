name: Pull Request

on:
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"
      - "**/*.sln"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
      - "Directory.Packages.props"
      - "Directory.Build.props"
      - "global.json"
      - "nuget.config"
      - "GitVersion.yml"
      - ".config/dotnet-tools.json"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "!**/*.md"

# A new push supersedes the run for the previous commit; cancelling it also keeps
# test-report.yml (which skips cancelled runs) from reporting stale results.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    # Skip workflow when merging from release branch into main
    if: |
      !(github.base_ref == 'main' && startsWith(github.head_ref, 'release/'))
    uses: ./.github/workflows/build-test.yml
    with:
      draft-check: true
