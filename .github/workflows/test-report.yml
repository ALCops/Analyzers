name: Test Report

# Fork-safe report path for pull requests only (fork PR runs have a read-only token,
# no checks: write). Push, scheduled and dispatch runs publish the same report to the
# run's job summary via the 'report' job in build-test.yml (publish-report: true),
# before any release job.
on:
  workflow_run:
    workflows: ['Pull Request']
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    runs-on: ubuntu-latest
    name: Report
    # dorny attaches the check to the PR's current head SHA, not the tested commit, so
    # a run for a commit the PR has since moved past would post stale results on the
    # new head. Skip it. Fork PRs have an empty pull_requests list; dorny then falls
    # back to workflow_run.head_sha, which is the tested commit, so they always pass.
    if: >-
      (github.event.workflow_run.conclusion == 'success'
       || github.event.workflow_run.conclusion == 'failure')
      && (!github.event.workflow_run.pull_requests[0].head.sha
          || github.event.workflow_run.pull_requests[0].head.sha == github.event.workflow_run.head_sha)
    steps:
      - name: Publish unified test report
        uses: dorny/test-reporter@v3
        with:
          artifact: test-results
          name: Test results
          report-title: 'ALCops Test Results'
          path: '**/*.trx'
          reporter: dotnet-trx
          use-actions-summary: 'false'
          list-suites: 'failed'
          list-tests: 'failed'
          collapsed: 'never'
          fail-on-error: true
          fail-on-empty: true
